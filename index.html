<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatApp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
  :root {
    --panel-dark: #202c33;
    --panel-header: #005c4b;
    --bg-chat: #0b141a;
    --bubble-out: #005c4b;
    --bubble-in: #202c33;
    --text-main: #e9edef;
    --text-dim: #8696a0;
    --accent: #00a884;
    --divider: #2a3942;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #111b21;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  #app {
    width: 100%;
    max-width: 420px;
    height: 640px;
    background: var(--panel-dark);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #setup {
    padding: 28px 24px;
    color: var(--text-main);
  }
  #setup h2 { margin: 0 0 4px; }
  #setup p { color: var(--text-dim); margin: 0 0 20px; font-size: 13px; }
  #setup label { font-size: 12px; color: var(--text-dim); display: block; margin: 14px 0 6px; }
  #setup input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--divider);
    background: #2a3942; color: var(--text-main); font-size: 14px;
  }
  #setup button {
    margin-top: 22px; width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: #05221c; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #setup button:hover { background: #06c193; }

  #chat-screen { display: none; flex-direction: column; height: 100%; }
  #header {
    background: var(--panel-header); color: #fff; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  #header .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  #header .info b { display: block; font-size: 15px; }
  #header .info span { font-size: 12px; color: #d9fdf5; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b; display: inline-block; margin-right: 5px;
  }
  #status-dot.online { background: #00e676; }

  #messages {
    flex: 1; overflow-y: auto; padding: 14px 10px;
    background: var(--bg-chat);
    background-image: radial-gradient(circle at 25% 15%, rgba(255,255,255,0.02) 0, transparent 40%),
                       radial-gradient(circle at 75% 85%, rgba(255,255,255,0.02) 0, transparent 40%);
    display: flex; flex-direction: column; gap: 2px;
  }
  .row { display: flex; margin: 3px 0; }
  .row.out { justify-content: flex-end; }
  .row.in { justify-content: flex-start; }
  .bubble {
    max-width: 75%; padding: 7px 10px 8px; border-radius: 9px; font-size: 14px;
    line-height: 1.35; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.3);
  }
  .row.out .bubble { background: var(--bubble-out); color: var(--text-main); border-top-right-radius: 2px; }
  .row.in .bubble { background: var(--bubble-in); color: var(--text-main); border-top-left-radius: 2px; }
  .bubble .sender { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; display: block; }
  .bubble .time {
    font-size: 10px; color: var(--text-dim); float: right; margin: 4px 0 -2px 8px;
  }
  .day-divider {
    align-self: center; background: #182229; color: var(--text-dim); font-size: 11px;
    padding: 4px 10px; border-radius: 8px; margin: 10px 0;
  }
  #empty-state {
    margin: auto; text-align: center; color: var(--text-dim); font-size: 13px; padding: 30px;
  }

  #input-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px; background: #202c33;
  }
  #messageInput {
    flex: 1; padding: 10px 14px; border-radius: 20px; border: none;
    background: #2a3942; color: var(--text-main); font-size: 14px; outline: none;
  }
  #messageInput::placeholder { color: var(--text-dim); }
  #sendBtn {
    width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent);
    color: #05221c; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: transform 0.1s;
  }
  #sendBtn:hover { background: #06c193; }
  #sendBtn:active { transform: scale(0.92); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: #374045; border-radius: 3px; }
</style>
</head>
<body>

<div id="app">

  <div id="setup">
    <h2>ChatApp</h2>
    <p>Enter your name and who you're chatting with to start.</p>
    <label>Your name</label>
    <input id="senderInput" placeholder="e.g. Aditi" autocomplete="off">
    <label>Chatting with</label>
    <input id="receiverInput" placeholder="e.g. Rohan" autocomplete="off">
    <button onclick="startChat()">Start chat</button>
  </div>

  <div id="chat-screen">
    <div id="header">
      <div class="avatar" id="peerAvatar">?</div>
      <div class="info">
        <b id="peerName">-</b>
        <span><span id="status-dot"></span><span id="statusText">connecting…</span></span>
      </div>
    </div>
    <div id="messages"><div id="empty-state">No messages yet. Say hi 👋</div></div>
    <div id="input-bar">
      <input id="messageInput" placeholder="Type a message" autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
    </div>
  </div>

</div>

<script>
let stompClient = null;
let me = '';
let peer = '';
let lastDay = null;
let onlineUsers = new Set();

function startChat() {
  const sender = document.getElementById('senderInput').value.trim();
  const receiver = document.getElementById('receiverInput').value.trim();
  if (!sender || !receiver) return;
  me = sender;
  peer = receiver;

  document.getElementById('setup').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('peerName').textContent = peer;
  document.getElementById('peerAvatar').textContent = peer.charAt(0).toUpperCase();

  connect();
}

function connect() {
  const socket = new SockJS('/chat');
  stompClient = Stomp.over(socket);
  stompClient.debug = null;
  stompClient.connect({}, function () {
    stompClient.subscribe('/topic/messages', function (payload) {
      const msg = JSON.parse(payload.body);
      if (isRelevant(msg)) renderMessage(msg);
    });

    stompClient.subscribe('/topic/online-users', function (payload) {
      const users = JSON.parse(payload.body);
      onlineUsers = new Set(users);
      updatePeerStatus();
    });

    stompClient.send("/app/join", {}, JSON.stringify({ username: me, status: "JOIN" }));

    document.getElementById('sendBtn').disabled = false;
    loadHistory();
  }, function () {
    updatePeerStatus(true);
  });

  window.addEventListener('beforeunload', function () {
    if (stompClient && stompClient.connected) {
      stompClient.send("/app/leave", {}, JSON.stringify({ username: me, status: "LEAVE" }));
    }
  });
}

function updatePeerStatus(forceOffline) {
  const isOnline = !forceOffline && onlineUsers.has(peer);
  document.getElementById('status-dot').className = isOnline ? 'online' : '';
  document.getElementById('statusText').textContent = isOnline ? 'online' : 'offline';
}

function isRelevant(msg) {
  return (msg.sender === me && msg.receiver === peer) ||
         (msg.sender === peer && msg.receiver === me);
}

function loadHistory() {
  fetch('/messages')
    .then(res => res.json())
    .then(messages => {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      lastDay = null;
      const relevant = messages.filter(isRelevant);
      if (relevant.length === 0) {
        box.innerHTML = '<div id="empty-state">No messages yet. Say hi 👋</div>';
        return;
      }
      relevant.forEach(renderMessage);
    });
}

function dayLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
}

function timeLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderMessage(msg) {
  const box = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.remove();

  const day = dayLabel(msg.time);
  if (day && day !== lastDay) {
    const divider = document.createElement('div');
    divider.className = 'day-divider';
    divider.textContent = day;
    box.appendChild(divider);
    lastDay = day;
  }

  const row = document.createElement('div');
  row.className = 'row ' + (msg.sender === me ? 'out' : 'in');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML =
    (msg.sender === me ? '' : `<span class="sender">${escapeHtml(msg.sender)}</span>`) +
    escapeHtml(msg.message) +
    `<span class="time">${timeLabel(msg.time)}</span>`;

  row.appendChild(bubble);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!message || !stompClient || !stompClient.connected) return;

  stompClient.send("/app/send", {}, JSON.stringify({ sender: me, receiver: peer, message }));
  input.value = '';
}

document.getElementById('messageInput')?.addEventListener('keypress', function (e) {
  if (e.key === 'Enter') sendMessage();
});
document.getElementById('receiverInput')?.addEventListener('keypress', function (e) {
  if (e.key === 'Enter') startChat();
});
</script>

</body>
</html>
